name: Build Privacy Chat APK
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleRelease :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Privacy-Chat-Release-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Prepare release build for emulator tests with the instrumentation certificate
        run: |
          sdk_signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$sdk_signer" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --out /tmp/privacy-chat-test.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$sdk_signer" verify /tmp/privacy-chat-test.apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install /tmp/privacy-chat-test.apk
            adb install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.privacychat.app.test/com.privacychat.app.SmokeRunner | tee smoke.log
            grep -q 'PRIVACY_SMOKE_OK' smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-instrumentation-log
          path: smoke.log
