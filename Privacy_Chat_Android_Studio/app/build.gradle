plugins { id 'com.android.application' }

android {
    namespace 'com.ktech.privacychat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ktech.privacychat'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '2.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
