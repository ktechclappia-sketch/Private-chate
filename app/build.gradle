plugins { id 'com.android.application' }

def releaseStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.isBlank() }

android {
 namespace 'com.privacychat.app'
 compileSdk 35
 defaultConfig {
  applicationId 'com.privacychat.app'
  minSdk 26
  targetSdk 35
  versionCode 3
  versionName '0.3.0'
  testInstrumentationRunner 'com.privacychat.app.SmokeRunner'
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
 signingConfigs {
  if (hasReleaseSigning) {
   create('release') {
    storeFile file(releaseStorePath)
    storePassword releaseStorePassword
    keyAlias releaseKeyAlias
    keyPassword releaseKeyPassword
   }
  }
 }
 buildTypes {
  getByName('debug') {
   applicationIdSuffix '.test'
   manifestPlaceholders = [appLabel: 'private chate']
  }
  getByName('release') {
   manifestPlaceholders = [appLabel: 'private chate']
   if (hasReleaseSigning) signingConfig signingConfigs.getByName('release')
  }
 }
}
