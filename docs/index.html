'use strict';const base='https://plwpjflifvndejidiwqa.supabase.co',key='sb_publishable_TJMHDU9hFHqenS9g0jPnOw_e9TmQVvj';let token='',busy=false;const $=id=>document.getElementById(id);function status(s){$('status').textContent=s}async function request(path,body,auth=false){const headers={apikey:key,'Content-Type':'application/json'};if(auth)headers.Authorization='Bearer '+token;const r=await fetch(base+path,{method:'POST',headers,body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.message||data.msg||data.error_description||'Request failed');return data}const rpc=(op,args={})=>request('/rest/v1/rpc/privacy_chat_action',{op,args},true);function clear(){token='';$('panel').hidden=true;$('login').hidden=false;$('payments').replaceChildren();$('password').value=''}async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){status(e.message)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}async function load(){const access=await rpc('access');if(access.admin!==true){clear();throw Error('Admin permission required')}const rows=await rpc('payments');if(!Array.isArray(rows))throw Error('Unexpected server response');$('payments').replaceChildren();$('count').textContent=rows.length+' pending payments';for(const p of rows){const a=document.createElement('article');for(const t of [p.email,'Amount: ₹100','UPI reference: '+p.reference]){const el=document.createElement('p');el.textContent=t;a.append(el)}for(const [op,label] of [['approve','Confirm ₹100 received'],['reject','Reject']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>run(async()=>{if(!confirm(op==='approve'?'Confirm only after checking your bank account. Approve?':'Reject this payment?'))return;await rpc(op,{id:p.id});status('Server accepted: '+op);await load()});a.append(b)}$('payments').append(a)}$('login').hidden=true;$('panel').hidden=false} $('for
