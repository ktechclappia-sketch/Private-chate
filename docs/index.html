<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a51e60">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://plwpjflifvndejidiwqa.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Privacy Chat · Admin Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./admin.css">
  <script defer src="./admin.js"></script>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Privacy Chat <span class="brand-role">Admin</span></div>
    <div class="tools" id="tools" hidden><button type="button" class="plain" id="refresh">Refresh</button><button type="button" class="plain" id="logout">Sign out</button></div>
  </div>
</header>
<main>
  <section id="login" class="login">
    <h1>Admin sign in</h1>
    <form id="form" method="post">
      <label>Email<input id="email" type="email" required autocomplete="username" autocapitalize="none"></label>
      <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="panel" hidden>
    <div class="title"><h1>Admin dashboard</h1><p id="updated"></p></div>
    <div id="metrics" class="metrics"></div>
    <nav aria-label="Dashboard views">
      <button type="button" data-view="users" aria-current="page">Users</button>
      <button type="button" data-view="payments">Payments</button>
      <button type="button" data-view="collections">Monthly collection</button>
    </nav>
    <section id="users" class="view">
      <div class="section-head"><h2>Registered users</h2><span id="user-count"></span></div>
      <div class="filters">
        <label>Search by email<input type="search" id="user-search" placeholder="Email address"></label>
        <label>Access status<select id="user-filter">
          <option value="">All statuses</option><option>Active</option><option>Expired</option><option>Inactive</option>
          <option>Free testing</option><option>Admin free</option><option>Deactivated</option>
        </select></label>
      </div>
      <div id="user-list"></div>
    </section>
    <section id="payments" class="view" hidden>
      <div class="section-head"><h2>Pending approvals</h2><span id="pending-count"></span></div>
      <div id="pending-list"></div>
      <div class="section-head history"><h2>Payment history</h2></div>
      <div class="filters">
        <label>Find payment<input type="search" id="payment-search" placeholder="Email or UPI reference"></label>
        <label>Payment status<select id="payment-filter"><option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></label>
      </div>
      <div id="payment-list"></div>
    </section>
    <section id="collections" class="view" hidden>
      <div class="section-head"><h2>Monthly collection</h2></div>
      <p class="explain">Approved payments by calendar month in India. Older approvals with no recorded approval date use the submission date.</p>
      <div id="monthly-list"></div>
    </section>
  </div>
</main>
<dialog id="confirm">
  <form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-detail"></p><div class="dialog-buttons"><button value="cancel">Cancel</button><button value="confirm" class="primary" id="confirm-ok">Confirm</button></div></form>
</dialog>
</body>
</html>
